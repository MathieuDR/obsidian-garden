# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: ~/.mathieu
  pageTitleSuffix: " | Growing ideas"
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: goatcounter
    host: deraedt.dev
    scriptSrc: https://insights.deraedt.dev/count.js
    websiteId: insights
  locale: en-GB
  baseUrl: mathieu.deraedt.dev
  ignorePatterns:
    - private
    - assets/templates
    - .obsidian
    - archived
    - Workflows
    - assets/scripts
    - assets/views
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Satoshi
      body: Roboto
      code: JetBrains Mono
    # Catppuccin palette applied to Quartz's native (flat) colour system:
    # light=Latte, dark=Mocha. secondary=mauve, tertiary=green.
    colors:
      lightMode:
        light: "#eff1f5"
        lightgray: "#ccd0da"
        gray: "#9ca0b0"
        darkgray: "#6c6f85"
        dark: "#4c4f69"
        secondary: "#8839ef"
        tertiary: "#40a02b"
        highlight: rgba(172, 176, 190, 0.15)
        textHighlight: "#df8e1d88"
      darkMode:
        light: "#1e1e2e"
        lightgray: "#313244"
        gray: "#6c7086"
        darkgray: "#a6adc8"
        dark: "#cdd6f4"
        secondary: "#cba6f7"
        tertiary: "#a6e3a1"
        highlight: rgba(88, 91, 112, 0.15)
        textHighlight: "#f9e2af88"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: catppuccin-frappe
        dark: catppuccin-mocha
      keepBackground: true
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      parseBlockReferences: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      openLinksInNewTab: true
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: local
      useThemeFonts: true
  - source: "@quartz-community/remove-draft"
    enabled: false
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
      rssLimit: 15
      rssFullHtml: false
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
    options:
      colorScheme: darkMode
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      title: Notes
      folderDefaultState: collapsed
      useSavedState: true
      order: [filter, sort, map]
      sortFn: |
        (a, b) => {
          const folderOrder = { slips: 1, output: 2, research: 3 }
          const seg = (n) => (n.slugSegment || n.displayName || "").toLowerCase()
          if (a.isFolder && b.isFolder) {
            const oa = folderOrder[seg(a)] || Number.MAX_SAFE_INTEGER
            const ob = folderOrder[seg(b)] || Number.MAX_SAFE_INTEGER
            if (oa !== ob) return oa - ob
            return seg(a).localeCompare(seg(b))
          }
          if (!a.isFolder && b.isFolder) return 1
          if (a.isFolder && !b.isFolder) return -1
          const af = a.slugSegments[a.slugSegments.length - 1]
          const bf = b.slugSegments[b.slugSegments.length - 1]
          return af <= bf ? 1 : -1
        }
      mapFn: |
        (node) => {
          if (node.isFolder) {
            node.displayName = node.displayName.charAt(0).toUpperCase() + node.displayName.slice(1)
          }
        }
      filterFn: |
        (node) => {
          const filtered = [
            "output/pages/1749074946-confirm",
            "output/pages/1749074960-thank-you",
            "output/pages/1746442137-about-me",
            "output/pages/1746442167-current-projects",
            "output/pages/1746441940-digital-garden",
          ]
          return filtered.indexOf(node.slug) == -1
        }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
    options:
      showReadingTime: false
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Home: /
        Recent notes: /recent
        Timeline: /timeline
        RSS Feed: /index.xml
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: true
    layout:
      position: right
      priority: 40
      display: all
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
      showProperties: []
    order: 5
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: ./local-plugins/transclude-unpublished
    enabled: true
    order: 29
    options:
      commonDirectories:
        - slips/
        - fleeting/
        - fleeting/archived/
        - fleeting/clippings/
  - source: ./local-plugins/title-fix
    enabled: true
    order: 6
  - source: ./local-plugins/timeline
    enabled: true
    order: 50
  - source: ./local-plugins/nav
    enabled: true
    options:
      links:
        About: /output/pages/1746442137-about-me
        Projects: /output/pages/1746442167-current-projects
        Garden: /output/pages/1746441940-digital-garden
    layout:
      position: left
      priority: 40
  - source: ./local-plugins/media-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 25
  - source: ./local-plugins/jsonld
    enabled: true
    options:
      author:
        name: Mathieu Deraedt
        url: https://mathieu.deraedt.dev
        sameAs:
          - https://github.com/MathieuDR
          - https://www.linkedin.com/in/mathieuderaedt
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
